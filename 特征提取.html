                    &lt;svg class=&quot;w-5 h-5&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; viewBox=&quot;0 0 24 24&quot;&gt;&lt;path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; stroke-width=&quot;2&quot; d=&quot;M13 10V3L4 14h7v7l9-11h-7z&quot;&gt;&lt;/path&gt;&lt;/svg&gt;

                降维后将它们投射到上面的坐标系中。你会发现，同一个人的多张照片（即使表情、光照、角度不同）在空间中对应的点依然保持极近的距离，这就是人脸识别模型（如 FaceNet）进行分类与身份锁定的核心原理。

    &lt;!-- 数据脚本 --&gt;
    &lt;script&gt;
        // 8张人脸素材数据
        const FACES = [
            // Person A
            { id: 'A1', person: 'A', name: '目标 A (照片1)', color: 'var(--color-a)', bgClass: 'bg-indigo-50 border-indigo-200 text-indigo-700', url: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/qqdWatv7Peu6jyEq2DGgu5.jpg', x: 25, y: 30, vector: Array.from({length: 16}, () =&gt; (0.15 + Math.random()*0.1).toFixed(3)) },
            { id: 'A2', person: 'A', name: '目标 A (照片2)', color: 'var(--color-a)', bgClass: 'bg-indigo-50 border-indigo-200 text-indigo-700', url: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/xW8fUTSmVDqsomJBkhZnni.jpg', x: 28, y: 22, vector: Array.from({length: 16}, () =&gt; (0.16 + Math.random()*0.1).toFixed(3)) },
            { id: 'A3', person: 'A', name: '目标 A (照片3)', color: 'var(--color-a)', bgClass: 'bg-indigo-50 border-indigo-200 text-indigo-700', url: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/zXoqeLDJPrixbaGpAB8Nrc.jpg', x: 20, y: 25, vector: Array.from({length: 16}, () =&gt; (0.14 + Math.random()*0.1).toFixed(3)) },
            // Person B
            { id: 'B1', person: 'B', name: '目标 B (照片1)', color: 'var(--color-b)', bgClass: 'bg-emerald-50 border-emerald-200 text-emerald-700', url: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/Ukyty3NKp2rLGKPsxf8YJK.jpg', x: 75, y: 70, vector: Array.from({length: 16}, () =&gt; (0.75 + Math.random()*0.1).toFixed(3)) },
            { id: 'B2', person: 'B', name: '目标 B (照片2)', color: 'var(--color-b)', bgClass: 'bg-emerald-50 border-emerald-200 text-emerald-700', url: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/BboVn8VWhErcLJTQeeLFFP.jpg', x: 80, y: 78, vector: Array.from({length: 16}, () =&gt; (0.78 + Math.random()*0.1).toFixed(3)) },
            // Person C
            { id: 'C1', person: 'C', name: '目标 C (照片1)', color: 'var(--color-c)', bgClass: 'bg-amber-50 border-amber-200 text-amber-700', url: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/u4XNL84QA9V25VpZt88MKB.jpg', x: 45, y: 68, vector: Array.from({length: 16}, () =&gt; (0.45 + Math.random()*0.1).toFixed(3)) },
            { id: 'C2', person: 'C', name: '目标 C (照片2)', color: 'var(--color-c)', bgClass: 'bg-amber-50 border-amber-200 text-amber-700', url: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/CHdJnoAVmcWNKizdpWdaq3.jpg', x: 40, y: 75, vector: Array.from({length: 16}, () =&gt; (0.42 + Math.random()*0.1).toFixed(3)) },
            { id: 'C3', person: 'C', name: '目标 C (照片3)', color: 'var(--color-c)', bgClass: 'bg-amber-50 border-amber-200 text-amber-700', url: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/jtvFkscPktnfxjcTn4MFyk.jpg', x: 48, y: 78, vector: Array.from({length: 16}, () =&gt; (0.47 + Math.random()*0.1).toFixed(3)) },
        ];

        // 模拟的人脸标志点 (相对人脸图像 280x280 的百分比)
        const LANDMARKS = [
            { x: 30, y: 35 }, { x: 40, y: 33 }, { x: 50, y: 35 }, { x: 60, y: 33 }, { x: 70, y: 35 }, // 眉毛与额头
            { x: 35, y: 45 }, { x: 45, y: 45 }, { x: 55, y: 45 }, { x: 65, y: 45 }, // 眼睛
            { x: 50, y: 52 }, { x: 46, y: 60 }, { x: 50, y: 62 }, { x: 54, y: 60 }, // 鼻子
            { x: 40, y: 72 }, { x: 50, y: 70 }, { x: 60, y: 72 }, { x: 50, y: 76 }, // 嘴巴
            { x: 25, y: 55 }, { x: 35, y: 80 }, { x: 50, y: 85 }, { x: 65, y: 80 }, { x: 75, y: 55 }  // 轮廓
        ];

        // 眼睛，鼻子，嘴等标志点之间的拓扑连线对
        const LANDMARK_CONNECTIONS = [
            [0, 1], [1, 2], [2, 3], [3, 4], // 眉
            [5, 6], [7, 8], // 眼睛
            [9, 10], [10, 11], [11, 12], [12, 9], // 鼻
            [13, 14], [14, 15], [15, 16], [16, 13], // 嘴
            [17, 18], [18, 19], [19, 20], [20, 21] // 脸部轮廓
        ];

        // 状态变量
        let drawnFaces = new Set(); // 记录已经抽取出的特征点
        let availableFaceIndices = [...Array(FACES.length).keys()]; // 待抽取的索引池
        let isExtracting = false;

        const btnDraw = document.getElementById('btn-draw');
        const btnFast = document.getElementById('btn-fast');
        const btnReset = document.getElementById('btn-reset');
        const faceImg = document.getElementById('face-img');
        const placeholderText = document.getElementById('placeholder-text');
        const currentLabel = document.getElementById('current-label');
        const landmarkContainer = document.getElementById('landmark-container');
        const landmarkSvg = document.getElementById('landmark-svg');
        const scanLine = document.getElementById('scan-line');
        const vectorContainer = document.getElementById('vector-container');
        const scatterLayer = document.getElementById('scatter-layer');
        const spaceSvg = document.getElementById('space-svg');
        const flyingPointer = document.getElementById('flying-pointer');

        // 初始化：渲染散点图中所有的灰色未激活状态，或者保持空白
        function initScatterPlot() {
            scatterLayer.innerHTML = '';
            spaceSvg.innerHTML = '';
            
            FACES.forEach(face =&gt; {
                // 创建一个点
                const dot = document.createElement('div');
                dot.id = `dot-${face.id}`;
                dot.className = 'absolute w-3.5 h-3.5 rounded-full border-2 border-white shadow-sm cursor-pointer transition-all duration-300 scale-95 opacity-20 hover:scale-125 hover:opacity-100 z-10';
                dot.style.left = `${face.x}%`;
                dot.style.top = `${face.y}%`;
                dot.style.backgroundColor = '#9CA3AF'; // 默认未激活灰色
                dot.title = face.name;

                // 点击空间中已经点亮的点，可以重新查看对应的照片和向量
                dot.addEventListener('click', () =&gt; {
                    if (drawnFaces.has(face.id) &amp;&amp; !isExtracting) {
                        highlightFace(face);
                    }
                });

                scatterLayer.appendChild(dot);
            });
        }

        // 产生高维特征向量的打字机滚动动效
        function animateVectorOutput(vector, color) {
            vectorContainer.innerHTML = '';
            let index = 0;
            
            function addValue() {
                if (index &lt; vector.length) {
                    const span = document.createElement('span');
                    span.className = 'px-1 bg-gray-800 rounded text-xs select-all transition-all duration-150 scale-75 opacity-0';
                    span.style.color = color;
                    span.innerText = vector[index];
                    vectorContainer.appendChild(span);

                    // 动画进入
                    anime({
                        targets: span,
                        scale: 1,
                        opacity: 1,
                        duration: 150,
                        easing: 'easeOutBack'
                    });

                    index++;
                    setTimeout(addValue, 40);
                }
            }
            addValue();
        }

        // 显示并点亮特征提取线
        function drawFaceLandmarks() {
            landmarkSvg.innerHTML = '';
            // 移除已有的点
            const oldDots = landmarkContainer.querySelectorAll('.face-landmark-dot');
            oldDots.forEach(dot =&gt; dot.remove());

            // 1. 绘制连线
            LANDMARK_CONNECTIONS.forEach(([p1, p2]) =&gt; {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', `${LANDMARKS[p1].x}%`);
                line.setAttribute('y1', `${LANDMARKS[p1].y}%`);
                line.setAttribute('x2', `${LANDMARKS[p2].x}%`);
                line.setAttribute('y2', `${LANDMARKS[p2].y}%`);
                line.setAttribute('stroke', 'rgba(99, 102, 241, 0.4)');
                line.setAttribute('stroke-width', '1.5');
                line.setAttribute('stroke-dasharray', '100');
                line.setAttribute('stroke-dashoffset', '100');
                landmarkSvg.appendChild(line);

                anime({
                    targets: line,
                    strokeDashoffset: [100, 0],
                    duration: 1000,
                    easing: 'easeOutSine',
                    delay: 200
                });
            });

            // 2. 绘制标志特征点
            LANDMARKS.forEach((pt, i) =&gt; {
                const dot = document.createElement('div');
                dot.className = 'face-landmark-dot bg-indigo-400 border border-white shadow';
                dot.style.left = `${pt.x}%`;
                dot.style.top = `${pt.y}%`;
                dot.style.opacity = '0';
                landmarkContainer.appendChild(dot);

                anime({
                    targets: dot,
                    opacity: [0, 1],
                    scale: [0.5, 1],
                    delay: anime.stagger(15, {start: 100}),
                    duration: 400,
                    easing: 'easeOutBack'
                });
            });
        }

        // 绘制特征空间中属于同类（同一个人）的所有点之间的相似度连线
        function updateSpaceSimilarityLines() {
            // 清理已有的 SVG 线条
            spaceSvg.innerHTML = '';

            // 按类别（A, B, C）来计算连线
            const groups = { A: [], B: [], C: [] };
            FACES.forEach(face =&gt; {
                if (drawnFaces.has(face.id)) {
                    groups[face.person].push(face);
                }
            });

            // 绘制连线
            Object.keys(groups).forEach(person =&gt; {
                const pts = groups[person];
                if (pts.length &gt; 1) {
                    for (let i = 0; i &lt; pts.length; i++) {
                        for (let j = i + 1; j &lt; pts.length; j++) {
                            const p1 = pts[i];
                            const p2 = pts[j];

                            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                            line.setAttribute('x1', `${p1.x}%`);
                            line.setAttribute('y1', `${p1.y}%`);
                            line.setAttribute('x2', `${p2.x}%`);
                            line.setAttribute('y2', `${p2.y}%`);
                            line.setAttribute('stroke', p1.color);
                            line.setAttribute('stroke-width', '2');
                            line.setAttribute('stroke-dasharray', '8 4');
                            line.setAttribute('opacity', '0.6');
                            spaceSvg.appendChild(line);

                            // 连线流动效果
                            anime({
                                targets: line,
                                strokeDashoffset: [24, 0],
                                duration: 1000,
                                loop: true,
                                easing: 'linear'
                            });
                        }
                    }
                }
            });
        }

        // 高亮当前选中的人脸特征点
        function highlightFace(face) {
            // 更新左侧肖像和标签
            faceImg.src = face.url;
            faceImg.className = &quot;w-full h-full object-cover transition-opacity duration-300 opacity-100&quot;;
            placeholderText.classList.add('hidden');
            landmarkContainer.classList.remove('hidden');

            currentLabel.innerText = face.name;
            currentLabel.className = `px-3 py-1 rounded-full text-xs font-semibold ${face.bgClass} transition-colors`;

            // 展示对应的向量串
            animateVectorOutput(face.vector, face.color);

            // 绘制面部特征点
            drawFaceLandmarks();

            // 重置所有空间点的状态
            FACES.forEach(f =&gt; {
                const dotElement = document.getElementById(`dot-${f.id}`);
                if (drawnFaces.has(f.id)) {
                    // 已激活的点显示对应颜色
                    dotElement.style.backgroundColor = f.color;
                    dotElement.style.opacity = '0.7';
                    dotElement.classList.remove('scale-150', 'ring-4', 'ring-indigo-200');
                } else {
                    // 未激活的点保持灰色和低透明度
                    dotElement.style.backgroundColor = '#9CA3AF';
                    dotElement.style.opacity = '0.2';
                }
            });

            // 突出显示当前被点亮的点
            const activeDot = document.getElementById(`dot-${face.id}`);
            activeDot.style.opacity = '1';
            activeDot.classList.add('scale-150');

            // 移除已有的脉冲特效并添加到当前点
            const existingPulse = document.querySelector('.active-pulse');
            if (existingPulse) existingPulse.remove();

            const pulseRing = document.createElement('div');
            pulseRing.className = 'active-pulse';
            pulseRing.style.left = `calc(${face.x}% - 8px)`;
            pulseRing.style.top = `calc(${face.y}% - 8px)`;
            pulseRing.style.width = '30px';
            pulseRing.style.height = '30px';
            pulseRing.style.backgroundColor = face.color;
            scatterLayer.appendChild(pulseRing);
        }

        // 随机抽取并执行特征映射动画
        function pickRandomFace() {
            if (isExtracting) return;
            
            // 如果所有照片都抽完了，提示用户重置
            if (availableFaceIndices.length === 0) {
                alert('所有照片已抽取完毕，请点击&ldquo;重置&rdquo;按钮重新开始。');
                return;
            }

            isExtracting = true;
            btnDraw.disabled = true;
            btnDraw.classList.add('opacity-50', 'cursor-not-allowed');

            // 从索引池中随机选一个索引
            const randomIndex = Math.floor(Math.random() * availableFaceIndices.length);
            const faceIndex = availableFaceIndices.splice(randomIndex, 1)[0];
            const chosen = FACES[faceIndex];

            // 1. 先载入并显示肖像
            faceImg.src = chosen.url;
            faceImg.className = &quot;w-full h-full object-cover transition-opacity duration-300 opacity-100&quot;;
            placeholderText.classList.add('hidden');
            landmarkContainer.classList.remove('hidden');

            currentLabel.innerText = &quot;图像载入中...&quot;;
            currentLabel.className = &quot;px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-500&quot;;
            vectorContainer.innerHTML = '&lt;span class=&quot;text-indigo-400&quot;&gt;正在扫描面部轮廓...&lt;/span&gt;';

            // 2. 扫描线动画
            scanLine.style.top = '0%';
            scanLine.style.opacity = '0.8';
            
            anime({
                targets: scanLine,
                top: ['0%', '100%'],
                duration: 1200,
                easing: 'easeInOutSine',
                complete: () =&gt; {
                    scanLine.style.opacity = '0';
                    currentLabel.innerText = chosen.name;
                    currentLabel.className = `px-3 py-1 rounded-full text-xs font-semibold ${chosen.bgClass}`;
                    
                    // 3. 绘制并显示特征标志点
                    drawFaceLandmarks();

                    // 4. 打字机输出特征向量
                    animateVectorOutput(chosen.vector, chosen.color);

                    // 5. 跨空间&ldquo;映射飞行&rdquo;动画（粒子从左侧发射飞向右侧空间点）
                    triggerMappingFlyAnimation(chosen);
                }
            });
        }

        // 触发粒子飞行轨迹，连接图像提取器与 2D 特征点
        function triggerMappingFlyAnimation(face) {
            // 获取头像框中心位置
            const imgRect = faceImg.getBoundingClientRect();
            const spaceRect = document.getElementById('space-container').getBoundingClientRect();

            // 计算相对右侧坐标系容器的起点坐标
            const startX = imgRect.left + imgRect.width / 2 - spaceRect.left;
            const startY = imgRect.top + imgRect.height / 2 - spaceRect.top;

            // 终点坐标
            const endX = (face.x / 100) * spaceRect.width;
            const endY = (face.y / 100) * spaceRect.height;

            // 设置飞行粒子属性
            flyingPointer.style.backgroundColor = face.color;
            flyingPointer.style.left = `${startX}px`;
            flyingPointer.style.top = `${startY}px`;
            flyingPointer.style.opacity = '1';
            flyingPointer.style.scale = '1';

            // 特征点预先就绪，但保持低调
            drawnFaces.add(face.id);

            // 运行飞行路径
            anime({
                targets: flyingPointer,
                left: [startX, endX],
                top: [startY, endY],
                scale: [1, 0.4],
                opacity: [1, 0.8],
                duration: 800,
                easing: 'easeOutQuad',
                complete: () =&gt; {
                    // 飞行完成，重置飞行指针
                    flyingPointer.style.opacity = '0';
                    flyingPointer.style.scale = '0';

                    // 激活并高亮散点图
                    highlightFace(face);

                    // 更新同类特征连线
                    updateSpaceSimilarityLines();

                    // 结束提取状态
                    isExtracting = false;
                    btnDraw.disabled = false;
                    btnDraw.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            });
        }

        // 快速分析：直接点亮所有点
        function fastAnalyze() {
            if (isExtracting) return;
            
            // 标记所有脸为已抽取
            FACES.forEach(f =&gt; drawnFaces.add(f.id));
            availableFaceIndices = []; // 清空池子

            // 更新 UI
            currentLabel.innerText = &quot;快速分析完成&quot;;
            currentLabel.className = &quot;px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700&quot;;
            
            // 隐藏占位符，显示容器（虽然不显示特定脸）
            placeholderText.classList.add('hidden');
            faceImg.classList.add('opacity-0'); 
            landmarkContainer.classList.add('hidden');
            vectorContainer.innerHTML = '&lt;span class=&quot;text-emerald-500&quot;&gt;所有特征向量已映射至空间&lt;/span&gt;';

            // 渲染所有散点
            FACES.forEach(face =&gt; {
                const dotElement = document.getElementById(`dot-${face.id}`);
                dotElement.style.backgroundColor = face.color;
                dotElement.style.opacity = '0.7';
                dotElement.classList.remove('scale-150');
            });

            // 更新连线
            updateSpaceSimilarityLines();
            
            // 禁用按钮
            btnDraw.disabled = true;
            btnDraw.classList.add('opacity-50', 'cursor-not-allowed');
            btnFast.disabled = true;
            btnFast.classList.add('opacity-50', 'cursor-not-allowed');

            // 移除脉冲
            const existingPulse = document.querySelector('.active-pulse');
            if (existingPulse) existingPulse.remove();
        }

        // 重置整个体验
        function resetSpace() {
            if (isExtracting) return;
            drawnFaces.clear();
            availableFaceIndices = [...Array(FACES.length).keys()];
            initScatterPlot();
            
            // 恢复按钮状态
            btnDraw.disabled = false;
            btnDraw.classList.remove('opacity-50', 'cursor-not-allowed');
            btnFast.disabled = false;
            btnFast.classList.remove('opacity-50', 'cursor-not-allowed');
            
            // 重置为透明占位图 URL
            faceImg.src = 'https://musk-online.fbcontent.cn/metis-misc/trans-placeholder.png';
            faceImg.className = &quot;w-full h-full object-cover transition-opacity duration-300 opacity-0&quot;;
            placeholderText.classList.remove('hidden');
            landmarkContainer.classList.add('hidden');
            landmarkSvg.innerHTML = '';
            
            currentLabel.innerText = &quot;等待输入&quot;;
            currentLabel.className = &quot;px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-500&quot;;
            
            vectorContainer.innerHTML = '&lt;span class=&quot;text-gray-500&quot;&gt;[等待提取...]&lt;/span&gt;';
            
            const existingPulse = document.querySelector('.active-pulse');
            if (existingPulse) existingPulse.remove();
        }

        // 绑定事件
        btnDraw.addEventListener('click', pickRandomFace);
        btnFast.addEventListener('click', fastAnalyze);
        btnReset.addEventListener('click', resetSpace);

        // 初始化渲染
        initScatterPlot();

    &lt;/script&gt;

  <script>

    function getIsMobile() {
      const width = document.documentElement.clientWidth
      const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|iPad|Windows Phone|Mobile/i.test(navigator.userAgent) || width <= 768
      return isMobile
    }

    // 打开飞象老师官网
    function openFeixiangTeacher(event) {
      const isMobile = getIsMobile()

      // 判断是否为移动端浏览器
      if (isMobile) {
        // 移动端不跳转
        return
      }
      window.open('https://www.feixianglaoshi.com', '_blank')
    }


    // ==================== 埋点相关代码 ====================

    /**
     * 页面停留时长统计
     */
    (function () {
      let startTime = null
      let totalTime = 0
      let reportTimer = null // 防抖定时器

      // 开始计时
      function startTimer() {
        if (!startTime) {
          startTime = Date.now()
          console.log('[埋点] 开始计时')
        }
      }

      // 停止计时并累加时长
      function stopTimer() {
        if (startTime) {
          totalTime += Date.now() - startTime
          startTime = null
          console.log('[埋点] 停止计时，累计时长:', Math.floor(totalTime / 1000), '秒')
        }
      }

      // 检查页面是否真正可见
      function isPageVisible() {
        // 检查 document.hidden
        if (document.hidden) {
          return false
        }

        // 检查 document.visibilityState
        if (document.visibilityState && document.visibilityState !== 'visible') {
          return false
        }

        // 检查窗口是否有焦点
        if (!document.hasFocus()) {
          return false
        }

        return true
      }

      // 上报停留时长（带防抖）
      function reportStayTime(eventType, immediate = false) {
        stopTimer()

        // 清除之前的定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 如果是立即上报（如页面卸载），不使用防抖
        if (immediate) {
          doReport(eventType)
          return
        }

        // 使用防抖，避免短时间内多次上报
        // 100ms 内如果有多个事件触发，只上报最后一次
        reportTimer = setTimeout(function () {
          doReport(eventType)
          reportTimer = null
        }, 100)
      }

      // 实际执行上报
      function doReport(eventType) {
        if (window.frog && totalTime > 0) {
          const serverData = window.__SERVER_DATA__ || {}
          const chatId = serverData.watermarkChatId
          window.frog.add({
            url: '/time/HtmlPage/enter',
            eventId: 42818,
            customExtend: {
              chat_id: chatId,
              use_time: Math.floor(totalTime / 1000), // 转换为秒
            },
            duration: Math.floor(totalTime / 1000), // 转换为秒,
            currentPage: 'HtmlPage',
            eventAction: 'time',
            eventName: 'enter'
          })
          console.log(`[埋点] 页面停留时长上报 (${eventType}):`, Math.floor(totalTime / 1000), '秒')

          // 上报后重置累计时长，为下次统计做准备
          totalTime = 0
        }
      }

      // 清理函数：移除所有事件监听器
      function cleanup() {
        console.log('[埋点] 清理计时器资源')

        // 清除防抖定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 移除事件监听器
        document.removeEventListener('visibilitychange', handleVisibilityChange)
        window.removeEventListener('blur', handleBlur)
        window.removeEventListener('focus', handleFocus)
        window.removeEventListener('beforeunload', handleBeforeUnload)
        window.removeEventListener('pagehide', handlePageHide)

        // 重置变量
        startTime = null
        totalTime = 0
      }

      // 事件处理函数（需要命名以便移除）
      function handleVisibilityChange() {
        if (document.hidden) {
          // 页面不可见，停止计时并上报
          console.log('[埋点] visibilitychange - 页面隐藏')
          reportStayTime('visibilitychange')
        } else {
          // 页面可见，开始新的计时
          console.log('[埋点] visibilitychange - 页面显示，开始新的计时')
          startTimer()
        }
      }

      function handleBlur() {
        // 窗口失去焦点，停止计时并上报
        console.log('[埋点] blur - 窗口失去焦点')
        reportStayTime('blur')
      }

      function handleFocus() {
        // 窗口获得焦点，开始新的计时
        console.log('[埋点] focus - 窗口获得焦点，开始新的计时')
        startTimer()
      }

      function handleBeforeUnload() {
        // 页面卸载前立即上报（不使用防抖）
        console.log('[埋点] beforeunload - 页面即将卸载')
        reportStayTime('beforeunload', true)
        cleanup()
      }

      function handlePageHide() {
        // 页面隐藏时立即上报（iOS Safari 更可靠，不使用防抖）
        console.log('[埋点] pagehide - 页面隐藏')
        reportStayTime('pagehide', true)
      }

      function handleDOMContentLoaded() {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 监听页面可见性变化
      document.addEventListener('visibilitychange', handleVisibilityChange)

      // 监听窗口失去/获得焦点
      window.addEventListener('blur', handleBlur)
      window.addEventListener('focus', handleFocus)

      // 页面加载完成后开始计时
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', handleDOMContentLoaded)
      } else {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 页面卸载时上报
      window.addEventListener('beforeunload', handleBeforeUnload)

      // 兼容性：监听 pagehide 事件（iOS Safari 更可靠）
      window.addEventListener('pagehide', handlePageHide)
    })()

      event.stopPropagation()

    // 绑定点击事件
    document.addEventListener('DOMContentLoaded', function () {
      // 绑定 Logo 点击埋点和跳转功能
      const logoElement = document.querySelector('.left-watermark-content')
      if (logoElement) {
        logoElement.addEventListener('click', function (event) {
          trackLogoClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定立即体验按钮点击埋点和跳转功能
      const startButton = document.querySelector('.jump-button')
      if (startButton) {
        startButton.addEventListener('click', function (event) {
          trackStartButtonClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定水印覆盖层点击（整体区域）
      const watermarkOverlay = document.querySelector('.watermark-overlay')
      if (watermarkOverlay) {
        watermarkOverlay.addEventListener('click', function (event) {
          // 如果点击的不是 logo 或按钮，则触发跳转
          const target = event.target
          const isLogo = target.closest('.left-watermark-content')
          const isButton = target.closest('.jump-button')

          if (!isLogo && !isButton) {
            openFeixiangTeacher(event)
          }
        })
      }
    })

    // ==================== 原有功能代码 ====================

    function adjustRem() {
      const pcBaseWidth = 375 // 设计稿
      const width = document.documentElement.clientWidth
      document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }


    // 移动端检测和按钮隐藏逻辑
    function checkAndHideButtonOnMobile() {
      const isMobile = getIsMobile()
      if (isMobile) {
        adjustRem()
      }
      const jumpButton = document.querySelector('.right-watermark-content .jump-button');
      const iframeContainer = document.querySelector('.iframe-container');

      if (isMobile && jumpButton) {
        jumpButton.style.display = 'none';
      } else {
        jumpButton.style.display = 'flex'
      }

      // 移动端时给iframe-container添加类名，否则移除类名
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }


    function handleResize() {
      // 响应式处理：重新检测移动端并处理按钮显示/隐藏
      checkAndHideButtonOnMobile();

      // 在窗口大小变化时，重新应用移动端相关的逻辑
      const isMobile = getIsMobile()
      const watermarkOverlay = document.querySelector('.watermark-overlay');
      const iframeContainer = document.querySelector('.iframe-container');

      // 根据当前设备类型调整水印覆盖层的点击行为
      if (watermarkOverlay) {
        if (isMobile) {
          // 移动端：移除点击事件或设置为空函数
          watermarkOverlay.onclick = function () {
            // 移动端不执行跳转
            return;
          };
        } else {
          // 桌面端：恢复正常的点击跳转功能
          watermarkOverlay.onclick = openFeixiangTeacher;
        }
      }

      // 确保在resize时也能正确添加或移除mobile类
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    // 防止iframe内容溢出
    window.addEventListener('resize', handleResize);

    // 页面加载完成后执行移动端检测
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    // 清理所有事件绑定的函数
    function clearAllEvents() {
      // 清除 resize 事件监听器
      window.removeEventListener('resize', handleResize);

      // 清除 DOMContentLoaded 事件监听器
      document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }

    // 页面卸载时自动清理事件（可选）
    window.addEventListener('beforeunload', clearAllEvents);

  </script>
